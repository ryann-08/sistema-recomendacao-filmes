    <!-- DETECTOR AUTOMÁTICO DE EXTENSÕES + BOTÃO ROXO DE ASSISTIR -->
    <script>
        const extensoes = ['.jpeg', '.webp', '.png', '.jpg.jpg', '.jpg.jpeg', '.jpg.webp', '.JPG', '.JPEG'];
        document.querySelectorAll('.movie-card').forEach(img => {
            let tentativa = 0;
            const caminhoBase = img.getAttribute('src').replace(/\.jpg$/i, '');
            img.addEventListener('error', function() {
                if (tentativa < extensoes.length && !this.src.includes('placeholder')) {
                    this.src = caminhoBase + extensoes[tentativa];
                    tentativa++;
                }
            });
        });

        // Cria o botão roxo "Assistir" em cada cartaz de filme
        document.querySelectorAll('.movie-card[data-id]').forEach(img => {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            img.parentNode.insertBefore(wrapper, img);
            wrapper.appendChild(img);

            const btn = document.createElement('button');
            btn.className = 'btn-assistir';
            btn.innerHTML = '&#9654; Assistir';
            wrapper.appendChild(btn);

            img.addEventListener('click', function(e) {
                if (!img.dataset.confirmado) {
                    e.stopImmediatePropagation();
                    document.querySelectorAll('.card-wrapper.ativo').forEach(w => w.classList.remove('ativo'));
                    wrapper.classList.add('ativo');
                } else {
                    delete img.dataset.confirmado;
                }
            }, true);

            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                wrapper.classList.remove('ativo');
                img.dataset.confirmado = 'true';
                img.click();
            });
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.card-wrapper')) {
                document.querySelectorAll('.card-wrapper.ativo').forEach(w => w.classList.remove('ativo'));
            }
        });
    </script>
