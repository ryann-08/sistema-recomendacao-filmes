    <!-- DETECTOR AUTOMÁTICO DE EXTENSÕES -->
    <script>
        const extensoes = ['.jpeg', '.webp', '.png', '.jpg.jpg', '.jpg.jpeg', '.jpg.webp', '.JPG', '.JPEG'];
        document.querySelectorAll('.movie-card').forEach(img => {
            let tentativa = 0;
            const caminhoBase = img.getAttribute('src').replace(/\.jpg$/i, '');
            img.addEventListener('error', function() {
                if (tentativa < extensoes.length && !this.src.includes('placeholder')) {
                    this.src = caminhoBase + extensoes[tentativa];
                    tentativa++;
                }
            });
        });
    </script>
